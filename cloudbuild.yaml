# Script Supervisor Backend - Google Cloud Build Pipeline
#
# GCP Cloud Build Trigger Configuration:
# - Event: Push to branch (main)
# - Build Configuration: Cloud Build configuration file (cloudbuild.yaml)
# - Included files (glob):
#     backend/**
#     cloudbuild.yaml
# - Ignored files (glob):
#     frontend/**

steps:
  # 1. Build the backend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/script-supervisor-backend:$COMMIT_SHA'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend'

  # 2. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/script-supervisor-backend:$COMMIT_SHA'

  # 3. Deploy image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'script-supervisor-git'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/script-supervisor-backend:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/script-supervisor-backend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
